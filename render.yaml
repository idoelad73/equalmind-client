# Render Blueprint - Equalmind client (this repository).
#
# WHAT THIS IS FOR: the rewrite rules at the bottom. Without them Render
# serves the built files literally, so /app, /register and /invite/accept
# are "Not Found" - there is no such file on disk, only a route React
# Router knows about. That is the 404 after Google sign-in.
#
# The API lives in a DIFFERENT repository (equalmind-server) and has its
# own render.yaml. A Blueprint is read from the root of one repo, so the
# two cannot be described together.
#
# A Blueprint does not apply itself. Either connect this repository as a
# Blueprint, or copy the two routes into the existing static site under
# Redirects/Rewrites - they do exactly the same thing, and the second
# needs no push.
#
# BEFORE SYNCING, check every CONFIRM below. name, region, plan and branch
# are account facts this file cannot know; a name that does not match the
# existing service makes Render create a SECOND one beside it.
#
# NO SECRET IS IN THIS FILE. Every key is a safe constant or `sync: false`,
# which tells Render "this one is set in the dashboard, leave it alone".

services:
  - type: web
    runtime: static
    name: equalmind-client          # CONFIRM: must match the existing service
    region: frankfurt               # CONFIRM
    plan: free                      # CONFIRM
    branch: develop                 # CONFIRM: the branch Render deploys
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      # Relative on purpose: the browser only ever sees one origin, so
      # cookies stay SameSite=Strict. The /api rewrite below is what makes
      # that true in production, the Vite proxy is what makes it true in
      # development.
      - key: VITE_API_URL
        value: /api
      - key: VITE_APP_NAME
        value: Equalmind
      # sync: false means "set this in the dashboard, do not read it from
      # here". The anon key is public by design - it ships in the bundle -
      # but it is still an account value, not a repository value.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

    # ORDER MATTERS. These are matched top to bottom, and the catch-all
    # below would otherwise swallow /api and hand the browser index.html
    # where it expected JSON.
    routes:
      # The API, proxied to the Express service so the client stays
      # same-origin. REPLACE THIS HOST with the server's own Render URL -
      # it is a guess, and a wrong one fails as a CORS error that looks
      # nothing like a wrong hostname.
      - type: rewrite
        source: /api/*
        destination: https://equalmind-server.onrender.com/api/*

      # Every client-side route. Rewrite, never redirect: a redirect
      # changes the address to /index.html, and React Router would then
      # have no path left to read - including the #access_token fragment
      # Supabase hands back after Google sign-in.
      - type: rewrite
        source: /*
        destination: /index.html
